# Level 1 gate: everything that can be checked without credentials.
#
# The edge and golden suites call the real LLM and real BigQuery, so they cannot
# run here — they stay a manual gate before handover (see tests/results/README.md).
# What CI can do is stop a change that breaks the code outright, and hold the line
# on the failure behaviour that matters most: when a dependency is broken, the
# agent must say so and must never report a pass.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  level-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Everything compiles
        run: python -m compileall -q src tests

      - name: Modules import cleanly
        working-directory: src
        run: python -c "import main, server, jira_reader, bigquery_executor, traceability_report, attachment_parser; import agents.intent_parser, agents.query_generator; print('all modules import')"

      # No BigQuery and no LLM key here, which is the point: these cases inject the
      # failures. Absent credentials also make the real-client case live, so CI
      # permanently exercises the "could not look" path.
      - name: Failure-injection suite
        run: python tests/failure_cases.py

      # Guards the approval boundary in the test harness itself. If this regex stops
      # recognising an approval, every case still passes and the boundary silently
      # stops being graded — so it is checked directly.
      - name: Approval detection self-check
        run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, "tests")
          src = open("tests/edge_cases.py").read()
          pattern = re.search(r"_APPROVAL_RE = re\.compile\(\s*(r\"[^\"]*\"\s*)+", src)
          assert pattern, "could not find _APPROVAL_RE in tests/edge_cases.py"
          approval = re.compile("".join(re.findall(r'r"([^"]*)"', pattern.group(0))),
                                re.IGNORECASE)
          for body, expected in (
              ("@agent APPROVED", True),
              ("@agent looks good, go ahead", True),
              ("APPROVED", False),
              ("Manager APPROVED the change request.", False),
              ("@agent - not approved yet, hold off", False),
              ("@agent REJECT - should be last 20 days, not 7", False),
          ):
              got = bool(approval.search(body))
              assert got is expected, f"{body!r} -> {got}, expected {expected}"
          print("approval detection correct")
          PY
