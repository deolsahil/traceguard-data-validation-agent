<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 424" width="100%" role="img"
     aria-label="How the validation agent works: it proposes a query, a human approves it, then it runs.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b778c"/>
    </marker>
  </defs>
  <rect width="950" height="424" fill="#f7f8fa" rx="10"/>
  <text x="24" y="30" font-size="10" font-weight="700" fill="#0052cc" letter-spacing="1.1">SCAN 1 — UNDERSTAND AND PROPOSE</text>
  <text x="24" y="46" font-size="10" fill="#6b778c">Reads the ticket and drafts a query. Nothing touches your data yet.</text>
  <rect x="24" y="58" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="24" y="58" width="158" height="3.5" rx="1.75" fill="#6b778c"/>
  <circle cx="39" cy="78" r="9.5" fill="#6b778c"/>
  <text x="39" y="81.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="55" y="82" font-size="11.5" font-weight="700" fill="#172b4d">Jira ticket</text>
  <text x="37" y="100.0" font-size="9.5" fill="#6b778c">A person describes the</text>
  <text x="37" y="112.5" font-size="9.5" fill="#6b778c">change in plain English</text>
  <line x1="184" y1="96" x2="204" y2="96" stroke="#6b778c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="210" y="58" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="210" y="58" width="158" height="3.5" rx="1.75" fill="#0052cc"/>
  <circle cx="225" cy="78" r="9.5" fill="#0052cc"/>
  <text x="225" y="81.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="241" y="82" font-size="11.5" font-weight="700" fill="#172b4d">Understand it</text>
  <text x="223" y="100.0" font-size="9.5" fill="#6b778c">LLM works out: which</text>
  <text x="223" y="112.5" font-size="9.5" fill="#6b778c">table, which column</text>
  <line x1="370" y1="96" x2="390" y2="96" stroke="#6b778c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="396" y="58" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="396" y="58" width="158" height="3.5" rx="1.75" fill="#0052cc"/>
  <circle cx="411" cy="78" r="9.5" fill="#0052cc"/>
  <text x="411" y="81.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="427" y="82" font-size="11.5" font-weight="700" fill="#172b4d">Read the schema</text>
  <text x="409" y="100.0" font-size="9.5" fill="#6b778c">BigQuery metadata only</text>
  <text x="409" y="112.5" font-size="9.5" fill="#6b778c">0 bytes scanned, free</text>
  <line x1="556" y1="96" x2="576" y2="96" stroke="#6b778c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="582" y="58" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="582" y="58" width="158" height="3.5" rx="1.75" fill="#0052cc"/>
  <circle cx="597" cy="78" r="9.5" fill="#0052cc"/>
  <text x="597" y="81.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="613" y="82" font-size="11.5" font-weight="700" fill="#172b4d">Write the query</text>
  <text x="595" y="100.0" font-size="9.5" fill="#6b778c">LLM writes a SELECT</text>
  <text x="595" y="112.5" font-size="9.5" fill="#6b778c">using the real columns</text>
  <line x1="742" y1="96" x2="762" y2="96" stroke="#6b778c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="768" y="58" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="768" y="58" width="158" height="3.5" rx="1.75" fill="#ff8b00"/>
  <circle cx="783" cy="78" r="9.5" fill="#ff8b00"/>
  <text x="783" y="81.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="799" y="82" font-size="11.5" font-weight="700" fill="#172b4d">Post it to Jira</text>
  <text x="781" y="100.0" font-size="9.5" fill="#6b778c">Comments the query</text>
  <text x="781" y="112.5" font-size="9.5" fill="#6b778c">and stops there</text>
  <rect x="24" y="158" width="902" height="52" rx="9" fill="#fff8ed" stroke="#ff8b00" stroke-width="1.6"/>
  <rect x="44" y="170" width="3.5" height="12" rx="1.2" fill="#ff8b00"/><rect x="51" y="170" width="3.5" height="12" rx="1.2" fill="#ff8b00"/><text x="64" y="180" font-size="12.5" font-weight="700" fill="#ff8b00">HUMAN APPROVAL GATE</text>
  <text x="44" y="197" font-size="10.5" fill="#8a5a00">The agent stops here and waits. No query touches your data until a person replies <tspan font-weight="700">@agent APPROVED</tspan> on the ticket.</text>
  <text x="700" y="189" font-size="10" fill="#6b778c">Days can pass. The agent</text>
  <text x="700" y="201" font-size="10" fill="#6b778c">re-reads the ticket to resume.</text>
  <text x="24" y="238" font-size="10" font-weight="700" fill="#00875a" letter-spacing="1.1">SCAN 2 — EXECUTE AND REPORT</text>
  <text x="24" y="254" font-size="10" fill="#6b778c">Only now does it run anything, and only the query that was approved.</text>
  <rect x="24" y="266" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="24" y="266" width="158" height="3.5" rx="1.75" fill="#ff8b00"/>
  <circle cx="39" cy="286" r="9.5" fill="#ff8b00"/>
  <text x="39" y="289.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="55" y="290" font-size="11.5" font-weight="700" fill="#172b4d">Reviewer replies</text>
  <text x="37" y="308.0" font-size="9.5" fill="#6b778c">A human reads it and</text>
  <text x="37" y="320.5" font-size="9.5" fill="#6b778c">comments @agent APPROVED</text>
  <line x1="184" y1="304" x2="204" y2="304" stroke="#6b778c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="210" y="266" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="210" y="266" width="158" height="3.5" rx="1.75" fill="#00875a"/>
  <circle cx="225" cy="286" r="9.5" fill="#00875a"/>
  <text x="225" y="289.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">7</text>
  <text x="241" y="290" font-size="11.5" font-weight="700" fill="#172b4d">Safety check</text>
  <text x="223" y="308.0" font-size="9.5" fill="#6b778c">SELECT-only. Any write</text>
  <text x="223" y="320.5" font-size="9.5" fill="#6b778c">statement is refused</text>
  <line x1="370" y1="304" x2="390" y2="304" stroke="#6b778c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="396" y="266" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="396" y="266" width="158" height="3.5" rx="1.75" fill="#00875a"/>
  <circle cx="411" cy="286" r="9.5" fill="#00875a"/>
  <text x="411" y="289.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">8</text>
  <text x="427" y="290" font-size="11.5" font-weight="700" fill="#172b4d">Run in BigQuery</text>
  <text x="409" y="308.0" font-size="9.5" fill="#6b778c">Executes exactly the</text>
  <text x="409" y="320.5" font-size="9.5" fill="#6b778c">query that was approved</text>
  <line x1="556" y1="304" x2="576" y2="304" stroke="#6b778c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="582" y="266" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="582" y="266" width="158" height="3.5" rx="1.75" fill="#00875a"/>
  <circle cx="597" cy="286" r="9.5" fill="#00875a"/>
  <text x="597" y="289.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">9</text>
  <text x="613" y="290" font-size="11.5" font-weight="700" fill="#172b4d">Read the result</text>
  <text x="595" y="308.0" font-size="9.5" fill="#6b778c">States what it found,</text>
  <text x="595" y="320.5" font-size="9.5" fill="#6b778c">or that it could not look</text>
  <line x1="742" y1="304" x2="762" y2="304" stroke="#6b778c" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="768" y="266" width="158" height="76" rx="9" fill="#fff" stroke="#dfe1e6"/>
  <rect x="768" y="266" width="158" height="3.5" rx="1.75" fill="#00875a"/>
  <circle cx="783" cy="286" r="9.5" fill="#00875a"/>
  <text x="783" y="289.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">10</text>
  <text x="799" y="290" font-size="11.5" font-weight="700" fill="#172b4d">Back to Jira</text>
  <text x="781" y="308.0" font-size="9.5" fill="#6b778c">Posts the outcome and</text>
  <text x="781" y="320.5" font-size="9.5" fill="#6b778c">updates the dashboard</text>
  <text x="24" y="372" font-size="10" fill="#6b778c">Read-only by design: the agent can never write, drop or change data — enforced in code, in the tests, and in its BigQuery permissions.</text>
  <text x="24" y="390" font-size="10" fill="#6b778c">One exception to the gate: a question answerable from metadata alone (“does this column exist?”) reads no rows, so there is nothing to approve and it answers immediately.</text>
  <text x="24" y="408" font-size="10" fill="#6b778c">If the reviewer replies <tspan font-weight="700">@agent REJECT — wrong window</tspan>, the agent rewrites the query using that reason and comes back to the gate again.</text>
  </svg>